<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<script>document.documentElement.dataset.theme = localStorage.getItem("sa.theme") || "dark";</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>silicon-agent · 登录</title>
<link rel="stylesheet" href="/static/chat.css">
<style>
  .login { min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.6 var(--font); }
  .login .box { width: min(420px, 92vw); padding: 28px 28px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
  .login .brand { font-weight: 600; font-size: 18px; display: flex; gap: 8px; align-items: center; }
  .login .brand .logo { color: var(--accent); }
  .login p { color: var(--text-2); margin: 10px 0 18px; }
  .login input { width: 100%; box-sizing: border-box; font: 14px var(--mono); color: var(--text); background: var(--surface-2); border: 1px solid var(--border-2); border-radius: 8px; padding: 10px 12px; }
  .login input:focus { outline: none; border-color: var(--accent); }
  .login button { margin-top: 12px; width: 100%; padding: 10px; font: 500 14px var(--font); color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  .login .err { color: var(--bad); min-height: 1.4em; margin-top: 8px; font-size: 13px; }
  .login .hint { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .login code { font-family: var(--mono); }
</style>
</head>
<body class="login">
  <form class="box" id="f">
    <div class="brand"><span class="logo">▣</span> silicon-agent</div>
    <p>输入访问令牌（服务器的 <code>SA_TOKEN</code>）。令牌只发送一次，浏览器之后用会话 cookie。</p>
    <input id="tok" type="password" autocomplete="current-password" placeholder="SA_TOKEN" autofocus>
    <button type="submit">进入</button>
    <div class="err" id="err"></div>
    <div class="hint">命令行与 MCP 用同一个令牌：<code>export SA_TOKEN=…</code> · 反向代理做了 SSO 的部署不会看到这一页</div>
  </form>
<script>
  const f = document.getElementById("f"), err = document.getElementById("err");
  f.onsubmit = async (e) => {
    e.preventDefault(); err.textContent = "";
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: document.getElementById("tok").value.trim() }) });
    if (r.ok) { location.replace(location.pathname === "/login" ? "/" : location.pathname + location.search); return; }
    err.textContent = r.status === 401 ? "令牌不对" : `登录失败（${r.status}）`;
  };
</script>
</body>
</html>
