<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>silicon-agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/chat.css">
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail">
    <div class="rail-head">
      <span class="brand"><span class="logo">▣</span> silicon-agent</span>
      <button id="new-chat" class="ghost icon" title="New chat">＋</button>
    </div>
    <ul id="threads" class="threads"></ul>
    <div class="rail-foot"><span id="who" class="mono muted"></span></div>
  </aside>

  <main class="main">
    <div class="topbar"><button id="t-rail" class="ghost icon" title="Conversations">☰</button><span id="title" class="title"></span><span class="grow"></span><a id="wt-link" class="ghost small btnlink" href="/work" target="_blank" hidden>worktable ↗</a><button id="stop" class="ghost small" hidden>■ 停止</button></div>
    <div class="scroll" id="scroll">
      <div class="col">
        <div id="hello" class="hello">
          <h1>你想要什么硬件？</h1>
          <p>用一句话描述。我会生成 Verilog，跑仿真、综合和布局布线，直到满足要求，然后把结果交给你。</p>
          <div class="examples" id="examples"></div>
        </div>
        <ol id="msgs" class="msgs"></ol>
      </div>
    </div>
    <div class="composer">
      <div class="col">
        <div class="inputbox"><textarea id="input" rows="1" placeholder="描述你要的硬件，或者对当前结果提要求…"></textarea><button id="send" class="primary icon" title="Send (⏎)">↑</button></div>
        <div class="chint" id="chint">⏎ 发送 · ⇧⏎ 换行</div>
      </div>
    </div>
  </main>
</div>
<script type="module" src="/static/chat.js"></script>
</body>
</html>
