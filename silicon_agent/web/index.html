<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<script>document.documentElement.dataset.theme = localStorage.getItem("sa.theme") || "dark";</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>silicon-agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/chat.css">
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail">
    <div class="rail-head">
      <span class="brand"><span class="logo">▣</span> silicon-agent</span>
      <button id="new-chat" class="ghost icon" title="新对话">＋</button>
    </div>
    <div class="rail-search"><input id="thread-search" type="search" autocomplete="off" spellcheck="false"></div>
    <nav id="rail-list" class="rail-list"></nav>
    <div class="rail-foot"><a id="wb-link" class="wb" href="/work" target="_blank">▦ <span id="wb-label">Workbench</span></a><span class="foot-r"><button id="theme" class="ghost icon" title="主题">◐</button><span id="who" class="mono muted"></span></span></div>
  </aside>

  <div id="scrim" class="scrim"></div>
  <main class="main">
    <div class="topbar">
      <button id="t-rail" class="ghost icon" title="对话列表">☰</button>
      <div id="crumbs" class="crumbs"></div>
      <span class="grow"></span>
      <span id="sess-usage" class="sess-usage mono muted" hidden></span>
      <button id="stop" class="ghost small" hidden>■ 停止</button>
      <button id="more" class="ghost icon" title="更多" hidden>⋯</button>
    </div>
    <div class="scroll" id="scroll">
      <div class="col">
        <div id="hello" class="hello">
          <div id="hello-project" class="hello-project" hidden></div>
          <h1>你想要什么硬件？</h1>
          <p>用一句话描述。我会生成 Verilog，跑仿真、综合和布局布线，直到满足要求，然后把结果交给你。</p>
          <div class="examples" id="examples"></div>
        </div>
        <section id="project" class="project" hidden>
          <div class="phead"><span class="pglyph">▣</span><input id="p-name" class="pname" spellcheck="false"><span id="p-stats" class="muted small"></span></div>
          <label class="plabel" id="p-ins-label"></label>
          <textarea id="p-ins" class="pins" rows="3" spellcheck="false"></textarea>
          <div id="p-ins-state" class="muted small"></div>
          <div id="p-best" class="pbest"></div>
          <div class="plist-head"><span id="p-threads-label"></span><button id="p-new" class="small"></button></div>
          <div id="p-threads" class="plist"></div>
          <div id="p-rtl" class="prtls"></div>
        </section>
        <ol id="msgs" class="msgs"></ol>
      </div>
    </div>
    <div class="composer">
      <div class="col">
        <div class="inputbox"><button id="attach" class="ghost icon" title="附加 RTL（.sv / .v）">＋</button><textarea id="input" rows="1" placeholder="描述你要的硬件，或者对当前结果提要求…"></textarea><button id="send" class="primary icon" title="发送（⏎）">↑</button></div>
        <input id="attach-file" type="file" accept=".sv,.v,.svh,.vh" multiple hidden>
        <div class="chint"><span id="chint">⏎ 发送 · ⇧⏎ 换行</span><span id="modes" class="modes" hidden></span></div>
      </div>
    </div>
  </main>
</div>
<div id="menu" class="menu" hidden></div>
<script type="module" src="/static/chat.js"></script>
</body>
</html>
