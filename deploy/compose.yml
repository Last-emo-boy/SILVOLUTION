# silicon-agent job server on the EDA host.
# Runs inside the existing local/vivado-desktop image so Vivado (xc7s50 backend)
# and oss-cad-suite (ecp5 backend) are both available. Published on 127.0.0.1 for the
# SSH-tunnel CLI path and joined to vivado-private so sluice can front the web UI with SSO.
#
#   docker compose --env-file /opt/silicon-agent/.env -f deploy/compose.yml up -d
#   docker logs -f silicon-agent
name: silicon-agent
services:
  server:
    image: local/vivado-desktop:2025.2
    container_name: silicon-agent
    user: "10001:10001"
    restart: unless-stopped
    init: true
    stop_grace_period: 30m          # SIGTERM lets the in-flight iteration finish (Vivado P&R can take minutes)
    working_dir: /app
    entrypoint: ["/bin/bash", "-c", "source /opt/amd/2025.2/Vivado/settings64.sh && exec /opt/silicon-agent/tools/oss-cad-suite/py3bin/python3 -m silicon_agent.server"]
    environment:
      HOME: /srv/sa/home
      SA_ROOT: /srv/sa                       # cache/, runs/, results/ live here (persistent)
      SA_TOOLS: /opt/silicon-agent/tools/oss-cad-suite
      SA_HOST: 0.0.0.0
      SA_PORT: "8765"
      SA_TOKEN: ${SA_TOKEN:?set SA_TOKEN in /opt/silicon-agent/.env}
      SA_GATEWAY_HMAC_KEY: ${SA_GATEWAY_HMAC_KEY:-}   # = sluice GATEWAY_HMAC_KEY; enables browser SSO via X-Auth-Sig
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in /opt/silicon-agent/.env}
      LD_PRELOAD: /lib/x86_64-linux-gnu/libudev.so.1   # FlexNet/udev fix, same as the vivado wrapper
      SA_XILINX_GLBL: /opt/amd/2025.2/Vivado/data/verilog/src/glbl.v
      SA_DISABLE_BACKENDS: ${SA_DISABLE_BACKENDS:-}   # comma-separated keys whose toolchain is not installed on this host (e.g. xc7a35t until Artix-7 device data is added to Vivado)
      SA_AGH: ${SA_AGH:-1}                   # 1: chat turns run inside Agnes Harness (the agh service); 0: the built-in nl.py loop
      SA_AGH_HOME: /srv/sa/agh               # the agh service's home: its unix socket lives under data/daemon/
      SA_AGH_PRESET: silicon                 # AGH recipe for chat sessions (the fork's read-only tool set)
      SA_ASIC_QUEUE: /srv/sa/asic/queue      # the orfs service's request queue (sky130 backend)
      SA_WEBHOOK: ${SA_WEBHOOK:-}            # optional: POSTed a run-finished JSON (Slack/Discord webhooks get a text line)
      SA_WORKERS: ${SA_WORKERS:-2}           # runs in flight at once (tournament variants overlap; the sky130 flow is serialized by the orfs runner anyway)
      SA_AGH_WEB: agh:4177                   # the harness's web workbench inside the agh container (relay -> loopback launcher), proxied at /agh/
      SA_AGH_WEB_ORIGIN: http://127.0.0.1:4178  # the origin the launcher is pinned to inside its container
      SA_AGH_WEB_GROUP: ${SA_AGH_WEB_GROUP:-}
      SA_PUBLIC_URL: ${SA_PUBLIC_URL:-https://silicon.w33d.xyz}
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    volumes:
      - /opt/silicon-agent/app:/app:ro
      - /opt/silicon-agent/tools:/opt/silicon-agent/tools:ro
      - /opt/amd:/opt/amd:ro
      - /srv/sa:/srv/sa
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=4g,mode=1777
    ports:
      - "127.0.0.1:8765:8765"          # SSH-tunnel path for the `sa` CLI
    networks:
      default: {}
      vivado-private:
        aliases: [silicon-agent]     # sluice reaches us here as http://silicon-agent:8765
    cpus: 10
    mem_limit: 16g
    pids_limit: 4096
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  # Agnes Harness: the agent runtime (model loop on DeepSeek, tool records, sessions). Shares /srv/sa so the
  # job server reaches its unix socket at /srv/sa/agh/data/daemon/agnesd.sock; its tools call the job server
  # over the compose network. Built from source on the host (/opt/agnes-harness, see deploy/agh-build.sh).
  agh:
    image: node:24-bookworm-slim
    container_name: silicon-agent-agh
    user: "10001:10001"
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    entrypoint: ["/bin/bash", "/opt/silicon-agent/app/deploy/agh-entry.sh"]
    environment:
      HOME: /srv/sa/home
      AGH_HOME: /srv/sa/agh
      AGNES_PROFILE: local-dev
      AGH_DIST: /opt/agnes-harness/packages/cli/dist/local
      SA_TOKEN: ${SA_TOKEN:?set SA_TOKEN in /opt/silicon-agent/.env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in /opt/silicon-agent/.env}
      SA_AGH_MODEL: ${SA_AGH_MODEL:-deepseek-flash}
      SA_SERVER: http://server:8765          # the plugin's tools reach the job server over the compose network
      SA_TOKEN_FILE: /srv/sa/agh/sa-token
    volumes:
      - /opt/silicon-agent/app:/opt/silicon-agent/app:ro
      - /opt/agnes-harness:/opt/agnes-harness:ro
      - /srv/sa:/srv/sa
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    networks:
      default: {}
    cpus: 2
    mem_limit: 3g
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true
  # OpenROAD-flow-scripts: the sky130 ASIC backend. No docker socket anywhere: the job server drops a request
  # directory under /srv/sa/asic/queue and this runner (deploy/orfs-runner.sh) runs the flow on it.
  orfs:
    image: openroad/orfs:latest
    container_name: silicon-agent-orfs
    user: "10001:10001"
    restart: unless-stopped
    init: true
    stop_grace_period: 10m
    entrypoint: ["/bin/bash", "/opt/silicon-agent/app/deploy/orfs-runner.sh"]
    environment:
      HOME: /srv/sa/home
      SA_ASIC_QUEUE: /srv/sa/asic/queue
      SA_ASIC_TIMEOUT: "3600"
    volumes:
      - /opt/silicon-agent/app:/opt/silicon-agent/app:ro
      - /srv/sa:/srv/sa
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g,mode=1777
    networks:
      default: {}
    cpus: 6
    mem_limit: 12g
    pids_limit: 4096
    security_opt:
      - no-new-privileges:true
networks:
  vivado-private:
    external: true
    name: vivado-private
